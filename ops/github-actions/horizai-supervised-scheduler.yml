# Inactive template. GitHub only loads workflow definitions from .github/workflows.
# Copy there only in a separately authorized activation phase.
name: HorizAI supervised scheduler (inactive template)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizai-supervised-scheduler
  cancel-in-progress: false

jobs:
  supervised-scheduler:
    if: github.repository == 'DiegoPerezSanchezDev/horizai' && vars.SCHEDULER_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run the supervised scheduler once
        env:
          SCHEDULER_WORKER_ENABLED: ${{ vars.SCHEDULER_WORKER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AGENT_PROVIDER: groq
          AGENT_API_URL: ${{ vars.AGENT_API_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: npm run pipeline:supervised:scheduled -- --execute-supervised
